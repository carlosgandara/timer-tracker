{% extends "base.html" %}

{% block content %}
<div class="container">
    <!-- Mascot & Title -->
    <div class="hero">
        <span class="mascot-big">🦊</span>
        <h1>Tap a Color to Start</h1>
        <p class="subtitle">Choose what you're doing, then tap "Stop" when you're done.</p>
    </div>

    <!-- Color Grid -->
    <div class="color-grid compact">
        {% for color in colors %}
        <div class="color-square small" 
             data-color="{{ color.color }}" 
             style="background: {{ color.hex_code }};" 
             title="{{ color.activity }}">
            <span class="color-label">{{ color.activity }}</span>
        </div>
        {% endfor %}
    </div>

    <!-- Timer Section -->
    <div class="timer-section" id="timer-section" style="display: none;">
        <div class="timer-header">
            <span class="mascot-timer" id="mascot-emoji">🦊</span>
            <span id="current-activity" class="activity-name">Working...</span>
        </div>
        <div class="timer-display" id="timer-bar">0s</div>
        <div class="timer-progress">
            <div class="timer-progress-fill" id="timer-progress-fill" style="width: 0%;"></div>
        </div>
        <button id="stop-btn" class="stop-btn">⏹ Stop</button>
    </div>
</div>
{% endblock %}
